<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Gallery · Scavengers Hole</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar compact">
        <div><p class="eyebrow">Community photos</p><h1 id="gallery-event-name">Event Gallery</h1></div>
        <nav class="top-actions">
          <button id="copy-event-invitation" class="primary-button small" type="button">Copy Invitation Link</button>
          <a href="/" class="secondary-button small">Change Event</a>
        </nav>
      </header>

      <nav class="event-navigation" aria-label="Event navigation">
        <a id="event-hunt-link" class="event-nav-link" href="#">Hunt</a>
        <a id="event-gallery-link" class="event-nav-link active" href="#">Gallery</a>
        <a id="event-scores-link" class="event-nav-link" href="#">Scores</a>
      </nav>

      <main>
        <section class="gallery-heading">
          <p class="eyebrow">All event submissions</p>
          <p id="gallery-description" class="helper-text"></p>
          <p id="gallery-count" class="helper-text"></p>
        </section>
        <section id="gallery-grid" class="gallery-grid" aria-live="polite"><div class="empty-state">Loading photos…</div></section>
      </main>
    </div>
    <script src="/static/invitation.js"></script>
    <script src="/static/gallery.js"></script>
  </body>
</html>
